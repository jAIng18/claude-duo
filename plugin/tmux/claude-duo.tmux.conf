# tmux config used ONLY by the dedicated claude-duo tmux server
# (`tmux -L claude-duo`). It never touches your own ~/.tmux.conf sessions.

# Scroll with the mouse wheel / trackpad. (To select text with the mouse,
# hold Option ⌥ while dragging in Terminal.app.)
set -g mouse on
set -g history-limit 50000

# Claude Code needs a fast Esc key and true colours.
set -s escape-time 10
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -s set-clipboard on

# Keep pane commands' own environment (claude-duo sets it explicitly).
set -g update-environment ""

# Status bar: show which peer this window is.
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "[claude-duo] #S "
set -g status-left-length 40
set -g status-right "#{?client_prefix,PREFIX ,}%H:%M"
set -g set-titles on
set -g set-titles-string "#S"
